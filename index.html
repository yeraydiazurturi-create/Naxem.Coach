html{background:#0e0e0f}

header{background:rgba(16,16,17,.92);border-bottom:1px solid rgba(255,255,255,.07);padding:14px 16px 0}

/* Hero */
.hero{background:linear-gradient(135deg,#221b1d 0,#131314 100%);border:1px solid rgba(255,255,255,.07);border-left:3px solid var(--ember);border-radius:10px;padding:24px 20px;margin-bottom:14px}

/* Tarjetas */
.card{background:var(--bone);color:#1a1a1c;border:0;border-top:3px solid var(--wine);border-radius:10px;box-shadow:0 10px 30px -14px rgba(0,0,0,.6)}

small{color:#6f685e}
label{color:var(--wine);letter-spacing:.14em;font-weight:700}

.tile{border:1px solid rgba(26,26,28,.14);border-radius:8px;background:rgba(255,255,255,.35)}

.mt{background:var(--bone);border-top:3px solid var(--wine);border-radius:10px;box-shadow:0 10px 30px -14px rgba(0,0,0,.6);color:#1a1a1c;transition:transform .15s}

.npg{display:grid;gap:10px;margin:14px 0 6px}.npc{display:grid;width:100%;min-height:0;letter-spacing:normal;text-transform:none;font-variant-numeric:normal;grid-template-columns:1fr auto;align-items:center;gap:2px 10px;text-align:left;padding:14px 16px;border:1.5px solid #d9d3c8;border-radius:12px;background:#fff;color:#222;cursor:pointer;font:400 15px/1.3 Archivo,"Helvetica Neue",Arial,sans-serif}.npc.on{border-color:#86222f;background:#fbf3f4;box-shadow:0 0 0 2px #86222f33}.npc,.npc.on,.npc:hover,.npc:active{color:#222!important;text-shadow:none}.npc .npm{font-size:15px;color:#222!important}.npc.on .npm{font-weight:600}.npc .npp{font-weight:700;font-size:19px;color:#86222f}.npc small{grid-column:1/3;color:#6f685e}
.day i.evc{border-color:transparent;background:#2f4858;color:#fff}.day i.evc.evk{background:#d9a441;color:#111}.nro input,.nro textarea,.nro select{pointer-events:none;opacity:.75}

/* ===== v16 · Minimal ===== menos peso, más aire, líneas finas */
:root{--hair:rgba(26,26,28,.09);--hairl:rgba(255,255,255,.09)}
body{background:#0e0e0f;line-height:1.5}
main{padding:18px 16px 28px;max-width:720px}
/* Cabecera y pestañas */
header{background:#0e0e0f;border-bottom:1px solid var(--hairl);padding:12px 16px 0}
#tabs button{font-family:Inter,system-ui,sans-serif;font-stretch:100%;font-weight:500;text-transform:none;letter-spacing:.01em;font-size:13.5px;color:#7d776d}
#tabs button.w{color:var(--white);border-bottom-color:var(--ember)}
/* Tipografía: titulares ligeros, sin mayúsculas gritonas */
h1,.big,.cat,.hh,.sec,.tile b,.ex-top b,.mt b,.card>b:first-child,.card>.row:first-child>b:first-child,.hoyt,.qk,.mcal .row b,.rcs,.plx{font-family:Inter,system-ui,sans-serif;font-stretch:100%;font-weight:600;text-transform:none;letter-spacing:-.005em}
.sec{font-size:21px;margin:30px 0 12px;font-weight:600;letter-spacing:-.01em}
.sec .script{font-size:30px;margin-left:6px;font-weight:400}
.hh{font-size:clamp(30px,9vw,46px);line-height:1.02;font-weight:700;letter-spacing:-.02em}
.hero .script{font-size:clamp(24px,7vw,36px)}
.big{font-weight:600;font-size:26px}
.card>b:first-child,.card>.row:first-child>b:first-child{font-size:15px;letter-spacing:0}
.tile b{font-size:20px;font-weight:600}
label{font-size:10.5px;letter-spacing:.14em;font-weight:600;color:#8a8175;text-transform:uppercase}
small{color:#857d70}
.mhd,.gtt,.lk,.rck,.yf small{letter-spacing:.26em;font-size:10px;font-weight:600}
/* Tarjetas: sin barra de color, borde fino, sombra suave */
.card,.mt,.lbc,.rcc{border:1px solid var(--hair);border-top:1px solid var(--hair);border-radius:16px;box-shadow:0 1px 2px rgba(0,0,0,.18),0 16px 36px -26px rgba(0,0,0,.55);background:#efeae0}
.card{padding:18px;margin-bottom:14px}
.hero,.hoy,.mcal{background:transparent;border:0;border-top:0;border-left:0;border-bottom:1px solid var(--hairl);border-radius:0;padding:22px 2px 20px;margin-bottom:18px}
.hero small,.hoy small{letter-spacing:.3em;font-size:10px}
.hoys{color:#9a9388}
.tile{background:#efeae0;border:1px solid var(--hair);border-radius:12px;padding:12px 8px}.card .tile{background:transparent}
.qk{border:1px solid var(--hair);border-top:1px solid var(--hair);border-radius:12px;box-shadow:none;font-size:10.5px;font-weight:600}
.qk em{background:var(--wine)}
/* Menú */
.menu{gap:12px}
.mt{padding:18px;min-height:100px}
.mt b{font-size:17px;font-weight:600}
.mt i{letter-spacing:.2em;font-size:10px;color:#a8946e}
.menu.mini .mt b{font-size:15px}
/* Botones: planos, discretos */
button{font-weight:500;letter-spacing:.03em;font-size:13px;text-transform:none;border-radius:10px;padding:10px 14px;background:#1c1c1e;border:1px solid var(--hairl)}
button.w{font-weight:600;background:var(--ember);color:#17120f}
button.x{font-weight:500}
.lgb{letter-spacing:.1em}
.qc{font-size:13.5px;padding:9px 14px;background:#efeae0;color:#1a1a1c}
.qc.on{background:var(--wine)}
/* Campos */
input,select,textarea{border:1px solid #d6cfc2;background:#f6f2ea;border-radius:10px}
input:focus,select:focus,textarea:focus{box-shadow:0 0 0 3px rgba(220,199,161,.28);border-color:#b79f78}
/* Líneas finas en vez de bloques */
.ex-top{border-bottom:1px solid var(--hair)}
td,th{border-bottom:1px solid var(--hair)}
.qa{border-bottom:1px solid var(--hair);padding:9px 0}
.tmr,.lbs,.pv,.crw,.qdc{border:1px solid var(--hair);background:rgba(255,255,255,.4);border-radius:12px}
.ss,.hab{border-left-width:3px}
.pb{height:4px;border-radius:2px}
.day{background:rgba(255,255,255,.4)}
.empty{color:#8a8479}
/* Pie y barra inferior */
#bnav{background:rgba(14,14,15,.96);border-top:1px solid var(--hairl)}
#bnav button{font-weight:500;color:#7d776d}
#bnav button.on{background:transparent;color:var(--ember)}
.yfl a{background:transparent;border-color:var(--hairl);font-size:13px;color:#cfc8bb}
/* Analizador y ayudas */
main>.menu+.menu,.menu{margin-bottom:12px}.card+.grid,.grid+.card,.grid+.grid,.menu+.card,.card+.menu{margin-top:12px}.grid>.tile{min-width:0}
button.inf{border-width:1px;color:#857d70;border-color:#a8a094}
.infb{background:rgba(26,26,28,.045)}
details.card summary{font-weight:500}
</style>
</head>

<script>
let KEY="entrenos_v1";const $=id=>document.getElementById(id);
const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today=ymd(new Date()),pf=v=>parseFloat(v)||0,uid=()=>Math.random().toString(36).slice(2,9);
const esc=v=>String(v==null?"":v).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
const DH=[["s1","Sueño","Sin pantallas antes de dormir","Sin dispositivos 1 h antes de acostarse","yn","",1],["s2","Sueño","Habitación oscura y fresca","Temperatura < 19 °C, sin luz","yn"],["s3","Sueño","Sin cafeína por la tarde","Nada de cafeína después de las 16:00","yn"],["r1","Recuperación","Estiramientos / movilidad","Sesión de flexibilidad y movilidad","num","min"],["h1","Hidratación & Nutrición","Hidratación diaria","Litros de agua consumidos","num","L"],["h2","Hidratación & Nutrición","Vaso de agua al despertar","Rehidratación tras la noche","yn"],["u1","Suplementación","Creatina","Monohidrato de creatina","num","g"],["u2","Suplementación","Magnesio","Glicinato, malato u otra forma","num","mg"],["m1","Mis hábitos","Sin lácteos","","yn"]].map(a=>({id:a[0],cat:a[1],name:a[2],desc:a[3],type:a[4],unit:a[5]||"",time:!!a[6]}));
let S={sessions:[],cur:null,rec:{},habits:null};
let USER="";
if(!S.habits)S.habits=[];
S.sessions.forEach(s=>{if(s.rpe==null)s.rpe="";if(s.done==null)s.done=false});
if(!S.cur&&S.sessions[0])S.cur=S.sessions[0].id;
let et="",tp="",rs="",pg="",rt={},openEx=new Set();let entV="home",rng=30,tab="menu",cm=new Date(),selDay=today,rd=today,metric="load",per="d";
function save(){if(!USER||!CL||(RO&&!NUTRI))return;push()}
const cur=()=>S.sessions.find(s=>s.id===S.cur);
const R=()=>S.rec[rd]||(S.rec[rd]={h:{},ci:{h:7,q:5,m:5,f:3,d:3,c:""}});
const stats=s=>({m:pf(s.total),load:pf(s.total)*pf(s.rpe),vol:s.ex.reduce((a,e)=>a+pf(e.series)*pf(e.reps)*pf(e.load),0)});
const newEx=()=>({id:uid(),video:"",name:"",obs:"",material:"",series:"",reps:"",rest:"",t:["","","",""],effType:"RPE",effVal:"",load:""});
function newSession(date){const s={id:uid(),name:(ET.find(x=>x[0]===et)||["","Fuerza"])[1]+" "+(S.sessions.length+1),date:date,total:"",rpe:"",done:LG.includes(et),type:et||"fuerza",ex:[]};S.sessions.unshift(s);S.cur=s.id;if(s.ex[0])openEx.add(s.ex[0].id)}
const fld=(l,f,v,ph,t)=>`<div><label>${l}</label><input type="${t||"text"}" data-f="${f}" value="${esc(v)}" placeholder="${ph||""}"></div>`;

function exH(e,i,lb){if(!openEx.has(e.id))return `<div class="card ex-s${lb&&lb.length>1?" ss":""}" data-i="${i}" data-act="toggEx" data-id="${e.id}"><div class="row"><b>${lb||i+1}. ${esc(e.name||"Sin nombre")}</b><small>Abrir ›</small></div><small>${[e.series&&e.reps?e.series+"×"+e.reps:"",e.load?e.load+" kg":"",e.effVal?e.effType+" "+e.effVal:""].filter(Boolean).map(esc).join(" · ")||"Sin datos"}</small></div>`;
return `<div class="card${lb&&lb.length>1?" ss":""}" data-i="${i}"><div class="ex-top"><b>Ejercicio ${lb||i+1}</b><span>${libCan("exercise")?`<button class="x" data-lb="xs" data-v="${e.id}">💾 Biblioteca</button>`:""}<button class="x" data-act="toggEx" data-id="${e.id}">Cerrar</button><button class="x" data-act="delEx">Eliminar</button></span></div>
${i?`<label style="display:flex;gap:8px;align-items:center;text-transform:none"><input type="checkbox" data-f="ss" style="width:auto" ${e.ss?"checked":""}> Superserie con el ejercicio anterior</label>`:""}${fld("Ejercicio","name",e.name,"Sentadilla frontal")}<label>Categoría</label><select data-f="cat" style="width:100%"><option value="">Sin categoría</option>${XC.map(c=>`<option${exCat(e)===c?" selected":""}>${c}</option>`).join("")}</select><small style="display:block;margin:4px 0 10px">En «Pliometría» el atleta registra también la altura del salto (cm) en cada serie.</small>${fld("Vídeo (enlace)","video",e.video,"https://youtube.com/…","url")}
${ytT(e)}${CLI()?"":`<div class="bar" style="margin:6px 0"><button class="on" data-exv="set" data-id="${e.id}">🎬 ${ytId(e.video)?"Cambiar vídeo":"Añadir vídeo de YouTube"}</button>${e.video?`<button data-exv="rm" data-id="${e.id}">Quitar vídeo</button>`:""}</div>`}
<label>Observaciones</label><textarea data-f="obs" placeholder="Técnica, claves, errores…">${esc(e.obs)}</textarea>
${fld("Material necesario","material",e.material,"Barra, discos, rack…")}
<div class="grid">${fld("Series","series",e.series,"4","number")}${fld("Repeticiones","reps",e.reps,"8")}${fld("Descanso","rest",e.rest,"90 s")}</div>
${velEd(e)}<div class="grid"><div><label>Tempo (x-x-x-x)</label><div class="tempo">${e.t.map((x,k)=>`<input data-t="${k}" value="${esc(x)}" placeholder="${["3","1","X","0"][k]}" maxlength="2">`).join("")}</div></div>${fld("Carga (kg)","load",e.load,"80","number")}<div></div></div>
<div class="eff"><div><label>Nivel de esfuerzo</label><select data-f="effType" style="width:100%">${["RPE","RIR","Zona cardíaca","Velocidad (%)","Cadencia (rpm)","Potencia (W)"].map(o=>`<option ${o===e.effType?"selected":""}>${o}</option>`).join("")}</select></div>${fld("Valor","effVal",e.effVal,"8 · 2 · Z3 · 75%")}</div></div>`}

function entH(){if(ROLE==="coach"&&CL){if(!libOk&&!libBusy&&!libErr)libLoad();catSync()}if(entV==="home")return homeT();const s=cur();
let h=`<div class="bar"><select id="sel">${S.sessions.map(x=>`<option value="${x.id}" ${x.id===S.cur?"selected":""}>${x.rec?"🔁 "+dowTxt(x.dow):esc(x.date)} · ${esc(x.name)}</option>`).join("")}</select>${CLI()?"":'<button class="w" data-act="tab" data-v="crt">+ Crear entrenamiento</button>'+(LG.includes(et)?'<button data-act="newS">+ Registro rápido</button>':"")}<button data-act="home">‹ Mis entrenos</button>${s&&CLI()?'<button data-v21="shs" data-id="'+s.id+'">Compartir</button>':""}${s&&canDel(s)?'<button data-act="delS">Eliminar</button>':""}</div>`;
if(!s)return h+'<div class="empty">Aún no hay sesiones. Crea una o planifícala desde el calendario.</div>';
if(isLog(s))return h+logH(s);
const st=stats(s);
return h+`<div class="card">${plBtn(s,1)}<div class="head"><div><label>Sesión</label><input data-s="name" ${CLI()?"disabled":""} value="${esc(s.name)}"></div>${s.rec?dowF(s):`<div><label>Fecha</label><input type="date" data-s="date" value="${esc(s.date)}"></div>`}<div><label>${s.rec?"Duración prevista (min)":"Tiempo total (min)"}</label><input type="number" data-s="total" value="${esc(s.total)}"></div>${s.rec?"":`<div><label>RPE sesión (1-10)</label><input type="number" min="1" max="10" data-s="rpe" value="${esc(s.rpe)}"></div>`}</div>
${typeH(s)}${s.rec?'<small>🔁 Se repite cada semana. Cada vez que la termines se guarda en tu historial con su fecha, duración y esfuerzo.</small>':`<label style="display:flex;gap:8px;align-items:center;text-transform:none"><input type="checkbox" data-s="done" style="width:auto" ${s.done?"checked":""}> Sesión realizada</label>`}
<div class="sum"><span>Carga (sRPE): <b id="sl">${st.load}</b> UA</span><span>Volumen: <b id="vol">${Math.round(st.vol)}</b> kg</span><span>Ejercicios: <b>${s.ex.length}</b></span></div>
<small>Carga sRPE = minutos × RPE de sesión.</small></div>`+s.ex.map((e,i)=>CLI()?exC(e,i,gl(s)[i]):exH(e,i,gl(s)[i])).join("")+(CLI()?"":`<button class="w" data-lb="pickX" style="width:100%">📚 Añadir desde mi biblioteca</button>${libCan("routine")?`<button data-rt="saveS" style="width:100%;margin-top:8px">💾 Guardar como rutina</button>`:""}`)}

function calH(){if(CLI()&&!evcOk&&!evcBusy)evcLoad();const y=cm.getFullYear(),m=cm.getMonth(),off=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate();
let c="LMXJVSD".split("").map(d=>`<div class="wd">${d}</div>`).join("");for(let i=0;i<off;i++)c+="<div></div>";
for(let d=1;d<=n;d++){const k=ymd(new Date(y,m,d)),ss=sOn(k);
c+=`<div class="day ${k===today?"td":""} ${k===selDay?"sel":""}" data-act="selDay" data-v="${k}"><b>${d}</b>${CLI()?evcOn(k).slice(0,1).map(e=>`<i class="evc evk">${e.kind==="call"?"📹 ":""}${esc(e.title)}</i>`).join(""):""}${ss.slice(0,2).map(s=>`<i class="${s.done?"dn":""}">${esc(s.name)}</i>`).join("")}${ss.length>2?`<i>+${ss.length-2}</i>`:""}</div>`}
const sd=sOn(selDay);
return `<div class="card"><div class="row"><button data-act="cPrev">‹</button><b style="text-transform:capitalize">${cm.toLocaleDateString("es-ES",{month:"long",year:"numeric"})}</b><button data-act="cNext">›</button></div><div class="cal" style="margin-top:10px">${c}</div>
<small>Relleno = realizada · borde = planificada</small></div>
<div class="card"><b>${new Date(selDay+"T00:00").toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"})}</b>
${sd.map(s=>`<div class="row" style="margin-top:8px"><span>${s.done?"✅":s.virt?"🔁":"🗓️"} ${esc(s.name)} <small>(${stats(s).load} UA)</small></span><span><button data-act="openS" data-v="${s.id}">Abrir</button>${selDay===today?plBtn(s):""}${!s.virt&&canDel(s)?`<button class="x" data-act="delS" data-v="${s.id}">Eliminar</button>`:""}</span></div>`).join("")||"<div><small>Sin sesiones este día.</small></div>"}${CLI()?evcDayH(selDay):""}
${CLI()?"":`<button class="w" style="margin-top:10px;background:var(--red);color:#fff" data-act="planS">+ Planificar sesión este día</button>`}</div>`}

function items(){const dn=S.sessions.filter(s=>s.done),val=s=>{const t=stats(s);return t[metric]};
const sc=d=>{const r=S.rec[d];return r&&r.saved?r.ci.score:null};
if(per==="d")return[...Array(21)].map((_,i)=>{const x=new Date();x.setDate(x.getDate()-20+i);const k=ymd(x);return{d:k,l:k.slice(5),v:dn.filter(s=>s.date===k).reduce((a,s)=>a+val(s),0),rd:sc(k)}});
if(per==="s")return dn.sort((a,b)=>a.date<b.date?-1:1).slice(-16).map(s=>({l:s.date.slice(5),v:val(s),rd:sc(s.date)}));
const mon=d=>{const x=new Date(d+"T00:00");x.setDate(x.getDate()-(x.getDay()+6)%7);return ymd(x)};
const out=[],m=new Date(mon(today)+"T00:00");m.setDate(m.getDate()-77);
for(let i=0;i<12;i++){const k=ymd(m),rs=Object.keys(S.rec).filter(d=>mon(d)===k&&sc(d)!=null).map(sc);
out.push({l:k.slice(5),v:dn.filter(s=>mon(s.date)===k).reduce((a,s)=>a+val(s),0),rd:rs.length?rs.reduce((a,b)=>a+b)/rs.length:null});m.setDate(m.getDate()+7)}return out}
const dayT=it=>`<div class="card"><b>Carga interna diaria</b><table><tr><th>Día</th><th>Sesión</th><th>UA</th><th>Ready</th></tr>${it.slice(-7).reverse().map(i=>{const ss=S.sessions.filter(s=>s.done&&s.date===i.d);return `<tr><td>${i.l}</td><td>${ss.map(s=>esc(s.name)).join(", ")||"–"}</td><td>${Math.round(i.v)}</td><td>${i.rd==null?"–":Math.round(i.rd)}</td></tr>`}).join("")}</table><small>UA = minutos × RPE de la sesión. Ready = readiness del check-in de ese día (línea negra del gráfico).</small></div>`;
function carH(){const it=items(),W=640,H=220,P=26,mx=Math.max(1,...it.map(i=>i.v)),bw=(W-2*P)/it.length;
let g=it.map((i,k)=>{const h=(H-2*P)*i.v/mx,x=P+k*bw;return `<rect x="${x+4}" y="${H-P-h}" width="${bw-8}" height="${h}" fill="#86222f" rx="3"/><text x="${x+bw/2}" y="${H-10}" font-size="10" text-anchor="middle" fill="#333">${i.l}</text>${i.v?`<text x="${x+bw/2}" y="${H-P-h-4}" font-size="10" text-anchor="middle" fill="#86222f">${Math.round(i.v)}</text>`:""}`}).join("");
const pts=it.map((i,k)=>i.rd==null?null:[P+k*bw+bw/2,H-P-(H-2*P)*i.rd/100]).filter(Boolean);
if(pts.length)g+=`<polyline points="${pts.map(p=>p.join(",")).join(" ")}" fill="none" stroke="#0d0d0d" stroke-width="2"/>`+pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#0d0d0d"/>`).join("");
const tb=per==="w"?`<table><tr><th>Semana</th><th>Valor</th><th>vs. media previa</th><th>Readiness</th></tr>${it.map((i,k)=>{const p=it.slice(Math.max(0,k-4),k).filter(x=>x.v>0),a=p.length?p.reduce((s,x)=>s+x.v,0)/p.length:0,r=a&&i.v?(i.v/a).toFixed(2):"–";return `<tr><td>${i.l}</td><td>${Math.round(i.v)}</td><td>${r}${r>1.5?" ⚠️":""}</td><td>${i.rd==null?"–":Math.round(i.rd)}</td></tr>`}).join("")}</table>`:"";
return `<div class="card"><div class="bar"><select id="metric"><option value="load" ${metric==="load"?"selected":""}>Carga interna (sRPE)</option><option value="vol" ${metric==="vol"?"selected":""}>Volumen (kg)</option><option value="m" ${metric==="m"?"selected":""}>Minutos</option></select><select id="per"><option value="w" ${per==="w"?"selected":""}>Por semana</option><option value="d" ${per==="d"?"selected":""}>Por día</option><option value="s" ${per==="s"?"selected":""}>Por sesión</option></select></div>
<svg viewBox="0 0 ${W} ${H}" style="width:100%">${g}</svg>
<small>Barras = ${metric==="load"?"carga sRPE":metric==="vol"?"volumen":"minutos"} (solo sesiones realizadas). Línea negra = readiness medio del check-in (0-100). ⚠️ = más de 1,5× tu media de las 4 semanas previas.</small></div>${tb?`<div class="card">${tb}</div>`:""}${per==="d"?dayT(it):""}`}

const CI=[["q","Calidad del sueño","¿Cómo fue la calidad del sueño?","Pésima","Excelente"],["m","Estado de ánimo","¿Cómo te encuentras mentalmente hoy?","Muy bajo","Excelente"],["f","Fatiga general","¿Cuánta fatiga acumulada sientes? (1 = ninguna)","Sin fatiga","Agotado"],["d","Daño muscular · DOMS","¿Tienes agujetas o dolor muscular? (1 = ninguno)","Sin molestias","Muy intenso"]];
const score=c=>Math.round(25*Math.min(c.h/8,1)+25*(c.q-1)/9+20*(c.m-1)/9+15*(10-c.f)/9+15*(10-c.d)/9);
function scoreBox(){const sc=score(R().ci),o=Object.keys(S.rec).filter(k=>k!==rd&&S.rec[k].saved&&S.rec[k].ci.score!=null).map(k=>S.rec[k].ci.score),a=o.length?Math.round(o.reduce((x,y)=>x+y)/o.length):null;
return `<span class="big">${sc}</span><small> /100</small><div><b style="color:var(--red)">${sc>=80?"ÓPTIMO":sc>=60?"MODERADO":"BAJO"}</b></div><div class="pb"><i style="width:${sc}%"></i></div>${a!=null?`<small>Tu media ${a} · hoy ${sc-a>=0?"+":""}${sc-a}</small>`:""}`}
const hdone=(h,r)=>h.type==="yn"?r.h[h.id]==="si":pf(r.h[h.id])>0;
function habH(h,r){const v=r.h[h.id],ctl=h.type==="yn"?`<div class="yn">${[["si","SÍ"],["no","NO"]].map(o=>`<button class="${v===o[0]?"on":""}" data-act="yn" data-id="${h.id}" data-v="${o[0]}">${o[1]}</button>`).join("")}</div>`:`<div class="num"><input type="number" step="any" data-h="${h.id}" value="${esc(v)}" placeholder="0"><small>${esc(h.unit)}</small></div>`;
return `<div class="hab ${hdone(h,r)?"ok":""}"><div style="flex:1"><b>${esc(h.name)}</b><br><small>${esc(h.desc)}</small>${h.time?`<div><small>Hora</small> <input type="time" data-h="${h.id}_t" value="${esc(r.h[h.id+"_t"])}" style="width:auto"></div>`:""}</div>${ctl}<button class="x" data-act="delH" data-id="${h.id}">✕</button></div>`}
function recH(){const r=R(),sv=k=>(S.rec[k]||{}).saved;let n=0,d=new Date();if(!sv(ymd(d)))d.setDate(d.getDate()-1);while(sv(ymd(d))){n++;d.setDate(d.getDate()-1)}
const strip=[...Array(7)].map((_,i)=>{const x=new Date();x.setDate(x.getDate()-6+i);const k=ymd(x);return `<div><small>${"LMXJVSD"[(x.getDay()+6)%7]}</small><span class="dot ${sv(k)?"on":""}">${sv(k)?"✓":""}</span></div>`}).join("");
const done=S.habits.filter(h=>hdone(h,r)).length,cats=[...new Set(S.habits.map(h=>h.cat))],c=r.ci;

/* ---- carga del vídeo y detección de fotogramas ---- */
function labDetect(v){
 return new Promise(res=>{
  if(!v.requestVideoFrameCallback){res(0);return}
  const ts=[];let done=false,id=0;
  const fin=()=>{if(done)return;done=true;try{v.pause();v.cancelVideoFrameCallback(id)}catch(e){}v.playbackRate=1;
   const d=[];for(let i=1;i<ts.length;i++){const x=ts[i]-ts[i-1];if(x>1e-4)d.push(x)}
   if(d.length<4){res(0);return}
   const q=d.slice().sort((a,b)=>a-b),base=q[Math.floor(q.length*.25)];let k=0,tt=0;d.forEach(x=>{k+=Math.max(1,Math.round(x/base));tt+=x});res(tt/k)};
  const cb=(n,md)=>{ts.push(md.mediaTime);if(ts.length>=14)fin();else id=v.requestVideoFrameCallback(cb)};

  s.sent=true;s.sentU=u;
  if(plan&&c.ev!=="none"){try{evLoad(true)}catch(e){}}
 }catch(e){s.err="No se pudo enviar: "+(e&&e.message?e.message:e)}
 s.busy=false;vcRender()}
async function vcAsk(){
 const s=VC.st;if(!s||s.busy||s.sent)return;vcCap();
 s.busy=true;s.err="";vcRender();
 try{const n=(s.note||"").replace(/\s+/g," ").trim().slice(0,160);await post("📹 Pido una videollamada"+(n?"\n"+n:""));s.sent=true}catch(e){s.err="No se pudo enviar: "+(e&&e.message?e.message:e)}
 s.busy=false;vcRender()}
document.addEventListener("click",ev=>{
 const o=document.getElementById("vcov");
 if(o&&ev.target===o){vcClose();return}
 const b=ev.target.closest&&ev.target.closest("[data-vc]");if(!b)return;
 const a=b.dataset.vc;
 if(a==="open"){ev.preventDefault();vcOpen(b.dataset.v)}
 else if(a==="close")vcClose();
 else if(a==="mode"){const s=VC.st;if(s){vcCap();s.mode=b.dataset.v==="plan"?"plan":"now";s.err="";vcRender()}}
 else if(a==="make"){window.open(b.dataset.v==="zoom"?"https://zoom.us/start/videomeeting":"https://meet.new","_blank","noopener")}
 else if(a==="send")vcGo();
 else if(a==="ask")vcAsk();
 else if(a==="ics"){ev.preventDefault();vcIcs(b.dataset.d,b.dataset.h,b.dataset.t,b.dataset.u)}
});
document.addEventListener("keydown",ev=>{if(ev.key==="Escape"&&VC.st)vcClose()});
/* botón en cada chat */
{const _cb6=chatBox;chatBox=function(){const h=_cb6.apply(this,arguments);let b="";try{b=vcBar()}catch(e){}if(!b)return h;const k=h.indexOf('<div id="chl"');return k<0?h:h.slice(0,k)+b+h.slice(k)}}
Object.assign(window,{VC,vcCard,vcJoinH,vcNorm,vcSafe,vcSaveLink,vcLoadLink,vcAnnounce,vcOpen,vcIcs,nxVc:{open:vcOpen,state:()=>VC.st,ctx:vcCtx,msg:vcMsg,go:vcGo,ask:vcAsk,card:vcCard}});

/* ===== v42 · Interruptores de funciones (administración) ===== */
const FNS=[
 {k:"lab",n:"Lab",i:"📏",d:"Medición por vídeo: saltos, velocidad, cambios de dirección y lanzamientos.",sel:['[data-act="tab"][data-v="lab"]','[data-lab]']},
 {k:"rnk",n:"Ranking",i:"🏆",d:"Compara los tests de cada atleta con los de su grupo.",sel:['[data-act="tab"][data-v="rnk"]']},
 {k:"fcz",n:"Zonas FC",i:"❤️",d:"Zonas cardíacas, VAM, VO₂máx y RM por VBT.",sel:['[data-act="tab"][data-v="fcz"]']},
 {k:"cpo",n:"Cuerpo",i:"💪",d:"Mapa muscular: estímulo, fuerza relativa y recuperación.",sel:['[data-act="tab"][data-v="cpo"]']},
 {k:"logros",n:"Compartir logros",i:"📸",d:"Imagen de la semana, del entreno o del progreso para redes y la comunidad.",sel:['[data-v21="shs"]','[data-v18="share"]']},
 {k:"video",n:"Videollamadas",i:"📹",d:"Enlace de Meet o Zoom en los chats y en el calendario.",sel:['[data-ag="kd"]','.vcbar']}];
let FNP=false,FNB=false,FNSIG="",FNT=0;
try{FNP=localStorage.getItem("nx_fn_prev")==="1"}catch(e){}
/* valor real del interruptor (si no está en la configuración, la función está activa) */
function fnVal(k){const f=CFG&&CFG.funciones;return!(f&&typeof f==="object"&&f[k]===false)}
/* ¿se muestra esta función a quien está usando la app? El administrador lo ve todo salvo que active "ver como los demás". */
function fnOn(k){if(fnVal(k))return true;return!!(ISADM&&!RO&&!FNP)}
function fnStyle(){
 const off=FNS.filter(f=>!fnOn(f.k)),sig=off.map(f=>f.k).join();if(sig===FNSIG)return;FNSIG=sig;
 let e=document.getElementById("fnoff");if(!e){e=document.createElement("style");e.id="fnoff";document.head.appendChild(e)}
 e.textContent=off.map(f=>f.sel.join(",")+"{display:none!important}").join("\n")}
/* si alguien estaba dentro de una sección que se apaga, se le lleva a la pantalla madre */
{const _rn=render;render=function(){try{const g={lab:"tst",rnk:"tst",cpo:"tst",fcz:"rec"};if(g[tab]&&!fnOn(tab))tab=g[tab];if(!fnOn("video")&&AGF&&AGF.ag_k)AGF.ag_k="";fnStyle()}catch(e){}return _rn.apply(this,arguments)}}
{const _so=shOpen;shOpen=function(){if(!fnOn("logros"))return;return _so.apply(this,arguments)}}
/* panel de administración */
function fnAdmin(){
 const n=FNS.filter(f=>fnVal(f.k)).length;
 const rows=FNS.map(f=>{const v=fnVal(f.k);return `<div class="fnr"><span class="fni">${f.i}</span><span class="fnt"><b>${esc(f.n)}</b><em class="fns${v?" on":""}">${v?"Activa":"Apagada"}</em><small>${esc(f.d)}</small></span><button type="button" class="fnsw${v?" on":""}" role="switch" aria-checked="${v}" aria-label="${esc(f.n)}" data-fnx="set" data-k="${f.k}"${FNB?" disabled":""}><i></i></button></div>`}).join("");
 return `<div class="card"><div class="row"><b>Funciones de la app</b><small>${n} de ${FNS.length} activas</small></div><small>Activa o apaga secciones para todos los entrenadores y atletas. Lo que apagues desaparece de los menús; no se borra ningún dato y puedes volver a activarlo cuando quieras.</small><div class="fnl">${rows}</div><div class="bar" style="margin:6px 0 0"><button data-fnx="all" data-v="1"${FNB?" disabled":""}>Activar todas</button><button data-fnx="all" data-v="0"${FNB?" disabled":""}>Apagar todas</button></div><small style="display:block;margin-top:10px">Los demás verán el cambio al abrir la app o en unos minutos.</small></div>
<div class="card"><b>Tu vista de administrador</b><div class="fnl"><div class="fnr"><span class="fni">👁</span><span class="fnt"><b>Ver la app como los demás</b><em class="fns${FNP?" on":""}">${FNP?"Activado":"Desactivado"}</em><small>${FNP?"Ahora ves solo lo que tienen activado el resto de cuentas.":"Ahora ves todas las funciones, también las apagadas, para poder probarlas antes de lanzarlas."}</small></span><button type="button" class="fnsw${FNP?" on":""}" role="switch" aria-checked="${FNP}" aria-label="Ver la app como los demás" data-fnx="prev"><i></i></button></div></div></div>`}
async function fnSave(next){
 const prev=CFG.funciones;CFG.funciones=next;FNB=true;render();
 try{const r=await SB.rpc("admin_do",{p_action:"config",p_kind:null,p_id:null,p_arg:{key:"funciones",value:next}});if(r.error)throw r.error}
 catch(e){CFG.funciones=prev;alert("No se pudo guardar: "+(e&&e.message?e.message:e))}
 FNB=false;render()}
document.addEventListener("click",async ev=>{
 const b=ev.target.closest&&ev.target.closest("[data-fnx]");if(!b||!ISADM)return;const a=b.dataset.fnx;
 if(a==="prev"){FNP=!FNP;try{localStorage.setItem("nx_fn_prev",FNP?"1":"0")}catch(e){}render();return}
 if(FNB)return;
 const cur=Object.assign({},CFG.funciones&&typeof CFG.funciones==="object"?CFG.funciones:{});
 if(a==="set"){const k=b.dataset.k;cur[k]=!fnVal(k)}
 else if(a==="all"){if(b.dataset.v==="0"&&!confirm("¿Apagar todas las funciones? Desaparecerán de los menús de todos los entrenadores y atletas."))return;FNS.forEach(f=>{cur[f.k]=b.dataset.v==="1"})}
 else return;
 await fnSave(cur)});
/* los cambios llegan a quien ya tiene la app abierta */
async function fnRefresh(){
 if(document.hidden||FNB||typeof USER==="undefined"||!USER||!SB||Date.now()-FNT<45000)return;FNT=Date.now();
 const a=JSON.stringify((CFG&&CFG.funciones)||{});try{await cfgLoad()}catch(e){return}
 if(JSON.stringify((CFG&&CFG.funciones)||{})!==a&&!typing())render()}
setInterval(fnRefresh,240000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)fnRefresh()});
Object.assign(window,{fnOn,fnAdmin,nxFn:{on:fnOn,val:fnVal,refresh:fnRefresh,style:fnStyle,flags:()=>FNS.map(f=>f.k)}});

render();
})();
</script>
